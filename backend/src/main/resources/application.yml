spring:
  profiles:
    default: local
  datasource:
    driverClassName: org.h2.Driver
  flyway:
    locations: classpath:db/migration
  sql:
    init:
      mode: never

server:
  port: 8080

logging:
  level:
    org.springframework.jdbc.core: warn

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: Zippy Backend
    version: "@project.version@"

zippy:
  security:
    api-key:
      enabled: true
      header: X-API-Key
      value: ${ZIPPY_API_KEY:}
    webhooks:
      enabled: true
      max-age-seconds: ${ZIPPY_WEBHOOK_MAX_AGE_SECONDS:300}
      max-body-bytes: ${ZIPPY_WEBHOOK_MAX_BODY_BYTES:1048576}
      secrets:
        fastship: ${ZIPPY_WEBHOOK_SECRET_FASTSHIP:}
        quickexpress: ${ZIPPY_WEBHOOK_SECRET_QUICKEXPRESS:}
        reliable: ${ZIPPY_WEBHOOK_SECRET_RELIABLE:}
