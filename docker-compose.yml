services:
  app:
    build: .
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-local}"
      SERVER_ADDRESS: "${SERVER_ADDRESS:-0.0.0.0}"
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/app/data/zippy;MODE=PostgreSQL;DATABASE_TO_UPPER=false;AUTO_SERVER=false"
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: "${ZIPPY_DB_PASSWORD:-zippy-local}"
      ZIPPY_AUTOMATION_ENABLED: "${ZIPPY_AUTOMATION_ENABLED:-true}"
      ZIPPY_API_KEY: "${ZIPPY_API_KEY:-}"
      ZIPPY_WEBHOOK_SECRET_FASTSHIP: "${ZIPPY_WEBHOOK_SECRET_FASTSHIP:-}"
      ZIPPY_WEBHOOK_SECRET_QUICKEXPRESS: "${ZIPPY_WEBHOOK_SECRET_QUICKEXPRESS:-}"
      ZIPPY_WEBHOOK_SECRET_RELIABLE: "${ZIPPY_WEBHOOK_SECRET_RELIABLE:-}"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - app_data:/app/data

  frontend:
    image: node:24-slim
    working_dir: /app
    init: true
    depends_on:
      app:
        condition: service_healthy
    environment:
      VITE_API_PROXY_TARGET: http://app:8080
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npm run dev:frontend -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:5174:5174"

volumes:
  app_data:
  frontend_node_modules:
