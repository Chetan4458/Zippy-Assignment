services:
  app:
    build: .
    ports:
      - "8080:8080"

  frontend:
    image: node:24-slim
    working_dir: /app
    depends_on:
      - app
    environment:
      VITE_API_PROXY_TARGET: http://app:8080
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev:frontend -- --host 0.0.0.0"
    ports:
      - "5174:5174"

volumes:
  frontend_node_modules:
